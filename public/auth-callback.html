<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Clash Of Mercy</title>
    <meta name="robots" content="noindex" />
    <style>
      :root {
        color-scheme: dark;
      }
      html,
      body {
        margin: 0;
        min-height: 100vh;
        background: #0b0f08;
      }
    </style>
  </head>
  <body>
    <script>
      (function () {
        var SCHEME = "com.clashofmercy.game:";
        var PACKAGE = "com.clashofmercy.game";
        var suffix =
          (window.location.search || "") + (window.location.hash || "");
        var customSchemeUrl = SCHEME + "//auth-callback" + suffix;
        var isAndroid = /android/i.test(navigator.userAgent);

        function openGame() {
          if (isAndroid) {
            window.location.replace(
              "intent://auth-callback" +
                suffix +
                "#Intent;scheme=" +
                SCHEME.replace(/:$/, "") +
                ";package=" +
                PACKAGE +
                ";end"
            );
          } else {
            window.location.replace(customSchemeUrl);
          }
        }

        openGame();

        // Some browsers drop the first custom-scheme navigation; retry once.
        window.setTimeout(openGame, 700);

        // If the game never took over (browser-only play), finish sign-in in the
        // web app instead of leaving the player on a blank page.
        window.setTimeout(function () {
          if (document.visibilityState === "visible") {
            window.location.replace("/" + suffix);
          }
        }, 2500);
      })();
    </script>
  </body>
</html>
