    <!--
      Sign-in safety net. Google sign-in belongs to the installed game, but if
      Supabase falls back to the plain Site URL instead of /auth-callback.html
      the code would be stranded on this website. Hand any OAuth result that
      lands on the site root to the relay page, which re-opens the app (and
      offers a manual button if the app is not installed).
    -->
    <script>
      (function () {
        try {
          var search = window.location.search || "";
          var hash = window.location.hash || "";
          var query = new URLSearchParams(search);
          var fragment = new URLSearchParams(hash.replace(/^#/, ""));
          var hasResult =
            query.has("code") ||
            query.has("error") ||
            query.has("error_description") ||
            fragment.has("code") ||
            fragment.has("access_token") ||
            fragment.has("error") ||
            fragment.has("error_description");
          if (!hasResult) return;

          var path = window.location.pathname;
          if (path !== "/" && path !== "/index.html") return;

          // Inside the installed app (https://localhost) the code is handled by
          // nativeAuth.js, so never redirect there.
          var host = window.location.hostname;
          if (!host || host === "localhost" || host === "127.0.0.1") return;
          if (
            window.Capacitor &&
            typeof window.Capacitor.isNativePlatform === "function" &&
            window.Capacitor.isNativePlatform()
          ) {
            return;
          }

          if (window.sessionStorage.getItem("com-auth-relay") === "1") return;
          window.sessionStorage.setItem("com-auth-relay", "1");

          window.location.replace("/auth-callback.html" + search + hash);
        } catch (error) {
          /* never block the page on the safety net */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
